<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Management App</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Ensure Tauri API is available
      if (typeof window !== 'undefined' && window.__TAURI__) {
        console.log('Tauri API is available');
      } else {
        console.warn('Tauri API is not available - running in browser mode');
      }
    </script>
    <script>
      // Add Tauri API to global scope if available
      if (typeof window !== 'undefined' && window.__TAURI__) {
        window.__TAURI_INVOKE__ = window.__TAURI__.invoke;
      }
    </script>
  </body>
</html>
